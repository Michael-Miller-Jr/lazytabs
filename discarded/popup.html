<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --accent-purple: #7b61ff;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --border-color: #2a2e40;
        }

        body.light-mode {
            --bg-color: #f4f5f8;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #666666;
            --border-color: #e0e0e0;
        }

        body {
            width: 340px;
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            box-sizing: border-box;
            transition: background 0.2s, color 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Updated to load the logo image instead of the shield emoji */
        .icon-box {
            width: 40px;
            height: 40px;
            background-color: transparent;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

            .icon-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

        .title-area h1 {
            font-size: 16px;
            margin: 0 0 2px 0;
            font-weight: 600;
        }

        .status-text {
            font-size: 12px;
            color: var(--accent-green);
            margin: 0;
            font-weight: 500;
        }

            .status-text.disabled {
                color: var(--text-muted);
            }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .toggle-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .toggle-text h2 {
            font-size: 14px;
            margin: 0 0 4px 0;
            font-weight: 600;
        }

        .toggle-text p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3a3f55;
            transition: .4s;
            border-radius: 24px;
        }

            .slider:before {
                position: absolute;
                content: "";
                height: 18px;
                width: 18px;
                left: 3px;
                bottom: 3px;
                background-color: white;
                transition: .4s;
                border-radius: 50%;
            }

        input:checked + .slider {
            background-color: var(--accent-purple);
        }

            input:checked + .slider:before {
                transform: translateX(20px);
            }

        .stats-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

            .stat-row:last-child {
                border-bottom: none;
            }

        .stat-label {
            color: var(--text-muted);
        }

        .stat-value {
            font-weight: 600;
        }

        .badge {
            background-color: rgba(46, 204, 113, 0.15);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

            .badge::before {
                content: "";
                width: 6px;
                height: 6px;
                background-color: var(--accent-green);
                border-radius: 50%;
            }

        .action-btn {
            width: 100%;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

            .action-btn:hover {
                background-color: rgba(123, 97, 255, 0.1);
            }

            .action-btn.danger {
                color: var(--accent-red);
            }

                .action-btn.danger:hover {
                    background-color: rgba(231, 76, 60, 0.1);
                    border-color: var(--accent-red);
                }

        .footer-links {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

            .footer-links span {
                margin: 0 6px;
                cursor: pointer;
                text-decoration: underline;
            }

                .footer-links span:hover {
                    color: var(--text-main);
                }

        .bottom-status {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

            .bottom-status .dot {
                display: inline-block;
                width: 6px;
                height: 6px;
                background-color: var(--accent-green);
                border-radius: 50%;
                margin-right: 4px;
            }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <!-- Replaced emoji with the icon48.png logo -->
            <div class="icon-box">
                <img src="icons/icon48.png" alt="Lazy Tabs Logo">
            </div>
            <div class="title-area">
                <h1>Lazy Tabs</h1>
                <p class="status-text" id="header-status">Tabs are being managed</p>
            </div>
        </div>
        <button class="settings-btn" id="theme-btn" title="Toggle Light/Dark Mode">🌙</button>
    </div>

    <div class="toggle-card">
        <div class="toggle-text">
            <h2>Discard Inactive Tabs</h2>
            <p>Prevents memory leaks</p>
        </div>
        <label class="switch">
            <input type="checkbox" id="master-toggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="stats-card">
        <div class="stat-row">
            <span class="stat-label">Status</span>
            <span class="badge" id="status-badge">Active</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Tabs Discarded</span>
            <span class="stat-value" id="discard-count">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Memory Saved</span>
            <span class="stat-value" id="memory-saved">~0 MB</span>
        </div>
    </div>

    <button class="action-btn" id="discard-now-btn">Discard Inactive Tabs Now</button>
    <button class="action-btn danger" id="whitelist-btn">Disable on this tab</button>

    <div class="footer-links">
        <span id="options-link">Options</span>
    </div>

    <div class="bottom-status">
        <span><span class="dot" id="bottom-dot"></span> <span id="bottom-text">Active on all sites</span></span>
        <span>v1.1</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
