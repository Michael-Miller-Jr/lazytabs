<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #1a1d2d;
      --text-main: #ffffff;
      --text-muted: #8b92a5;
      --border-color: #2a2e40;
    }
    body.light-mode {
      --bg-color: #f4f5f8;
      --card-bg: #ffffff;
      --text-main: #000000;
      --text-muted: #666666;
      --border-color: #e0e0e0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      display: flex;
      justify-content: center;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    h1 { margin-top: 0; }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .setting-row:last-child { border-bottom: none; }
    p { color: var(--text-muted); font-size: 14px; margin: 5px 0 0 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lazy Tabs Settings</h1>
    <div class="setting-row">
      <div>
        <strong>Auto-discard inactive tabs</strong>
        <p>Automatically unload tabs after 15 minutes of inactivity.</p>
      </div>
      <input type="checkbox" id="auto-discard-toggle" style="width: 20px; height: 20px;">
    </div>
    <div class="setting-row">
      <div>
        <strong>Discard Pinned Tabs</strong>
        <p>If enabled, pinned tabs will also be unloaded.</p>
      </div>
      <input type="checkbox" id="pinned-toggle" style="width: 20px; height: 20px;">
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
